name: Build APK
on:
  push:
    branches: [main, main-b4uwto]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle :app:testDebugUnitTest --stacktrace
      - run: gradle :app:assembleRelease --stacktrace
      - name: Mostrar firma del APK
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: kronos-focus-debug-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publicar APK como Release (descarga directa)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk kronos-focus-debug.apk
          gh release delete debug-latest --cleanup-tag -y || true
          gh release create debug-latest kronos-focus-debug.apk --prerelease --target "${{ github.sha }}" \
            --title "Kronos Focus (debug)" --notes "APK de prueba del commit ${{ github.sha }}"
